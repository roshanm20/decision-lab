name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # Daily commits are pushed with the workflow token, which does not trigger
  # push events, so CI also runs after every daily build.
  workflow_run:
    workflows: ["Daily build"]
    types: [completed]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || '' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --quiet pytest . 
      - name: Tests
        run: python -m pytest -q
      - name: The installed command works
        run: decisionlab list
      - name: House checks
        if: matrix.python-version == '3.12'
        run: python scripts/check.py --fast --all
