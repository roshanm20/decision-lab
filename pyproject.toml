[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "decisionlab"
version = "0.1.0"
description = "Small, tested tools for consultants, BI analysts, marketers and product managers. Standard library first."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Muhammed Roshan M" }]
keywords = ["business intelligence", "consulting", "product management", "marketing analytics", "ab testing", "market sizing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Financial and Insurance Industry",
  "Topic :: Office/Business",
]

[project.urls]
Homepage = "https://github.com/roshanm20/decision-lab"

[project.scripts]
decisionlab = "decisionlab.cli:main"

[tool.setuptools.packages.find]
include = ["decisionlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
